name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.18.0"
  PYTHON_VERSION: "3.12"

jobs:
  python-core:
    name: Python core
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install locked Python dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check

      - name: Validate source and generated catalog
        run: |
          python scripts/check_duplicate_filenames.py
          python scripts/validate_model_catalog.py
          python -m compileall -q src tests scripts

      - name: Check critical Python static errors
        run: |
          python -m flake8 src tests scripts \
            --select E9,F63,F7,F82 \
            --exclude .venv,frontend/node_modules,desktop/src-tauri/target
          python -m mypy --follow-imports=skip \
            src/utils/newapi_models.py \
            src/utils/media_refs.py \
            src/utils/provider_registry.py \
            src/utils/model_catalog.py \
            src/utils/uploads.py \
            src/utils/deployment_security.py \
            src/apps/comic_gen/export.py

      - name: Check formatting of active safety surfaces
        run: |
          python -m black --check \
            src/apps/hybrid \
            src/apps/playground/api.py \
            src/apps/playground/service.py \
            src/apps/playground/storage.py \
            src/utils/__init__.py \
            src/utils/deployment_security.py \
            src/utils/uploads.py \
            src/apps/comic_gen/export.py \
            scripts/check_duplicate_filenames.py \
            tests/test_art_direction_analysis.py \
            tests/test_bulk_video_generation.py \
            tests/test_deployment_security.py \
            tests/test_dev_setup_contract.py \
            tests/test_export_media.py \
            tests/test_generation_contracts.py \
            tests/test_hybrid_desktop.py \
            tests/test_persistence_contracts.py \
            tests/test_polish_error.py \
            tests/test_repo_hygiene.py \
            tests/test_runtime_scripts.py \
            tests/test_enmotion_paths.py \
            tests/test_upload_limits.py
          python -m isort --check-only \
            src/apps/hybrid \
            src/apps/playground/api.py \
            src/apps/playground/service.py \
            src/apps/playground/storage.py \
            src/utils/__init__.py \
            src/utils/deployment_security.py \
            src/utils/uploads.py \
            src/apps/comic_gen/export.py \
            scripts/check_duplicate_filenames.py \
            tests/test_art_direction_analysis.py \
            tests/test_bulk_video_generation.py \
            tests/test_deployment_security.py \
            tests/test_dev_setup_contract.py \
            tests/test_export_media.py \
            tests/test_generation_contracts.py \
            tests/test_hybrid_desktop.py \
            tests/test_persistence_contracts.py \
            tests/test_polish_error.py \
            tests/test_repo_hygiene.py \
            tests/test_runtime_scripts.py \
            tests/test_enmotion_paths.py \
            tests/test_upload_limits.py

      - name: Run Python regression suite
        env:
          ENMOTION_DATA_DIR: ${{ runner.temp }}/enmotion-data
          ENMOTION_LOG_DIR: ${{ runner.temp }}/enmotion-data/logs
          ENMOTION_OUTPUT_DIR: ${{ runner.temp }}/enmotion-output
          ENMOTION_PRELOAD_DEMUCS: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -p no:cacheprovider -q
          --cov=src --cov-report=term --cov-report=xml
          --cov-fail-under=40

      - name: Audit installed Python dependencies
        run: python -m pip_audit --local --progress-spinner off

  frontend:
    name: Frontend and browser development tooling
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Verify browser development launchers
        run: |
          npm ci --ignore-scripts
          npm ls --depth=0
          node --check scripts/dev-setup.js
          node --check scripts/start-backend.js
          node --check scripts/open-browser.js

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm ls --depth=0

      - name: Run frontend quality gates
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test:all
          npm run check:colors
          npm run check:assets
          npm run build
          npm run check:export
          npm run check:bundle
          grep -q '/static/_next/' out/index.html

      - name: Audit shipped frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  control-plane:
    name: Control plane
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            control_plane/requirements.txt
            control_plane/requirements-dev.txt

      - name: Install control-plane dependencies
        working-directory: control_plane
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run control-plane tests
        working-directory: control_plane
        run: |
          python -m compileall -q app migrations scripts tests
          python -m pytest \
            -W error \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Verify migration head and schema drift
        working-directory: control_plane
        env:
          ENMOTION_ENV: development
          ENMOTION_DATABASE_URL: sqlite:///${{ runner.temp }}/enmotion-control-ci.db
          ENMOTION_SESSION_HMAC_SECRET: ci-only-session-secret-that-is-long-enough
          ENMOTION_COOKIE_SECURE: "false"
        run: |
          alembic upgrade head
          alembic check

  desktop:
    name: Desktop contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-desktop-contract.txt

      - name: Install desktop contract dependencies
        run: |
          python -m pip install -r requirements-desktop-contract.txt
          python -m pip check

      - name: Validate desktop Python and release contracts
        run: |
          python -m unittest discover -s desktop/python -p "test_*.py"
          python -m compileall -q desktop/python desktop/scripts
          python desktop/scripts/validate.py

      - name: Compile and test the native shell
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
        run: >-
          cargo test --locked
          --manifest-path desktop/src-tauri/Cargo.toml
