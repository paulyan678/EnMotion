name: 发布 EnMotion 桌面版

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing desktop-vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: enmotion-desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.18.0"
  PYTHON_VERSION: "3.12"
  TAURI_CLI_VERSION: "2.11.4"
  PYINSTALLER_VERSION: "6.21.0"

jobs:
  preflight:
    name: Release preflight
    runs-on: macos-15
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-desktop-contract.txt

      - name: Install desktop contract dependencies
        run: |
          python3 -m pip install -r requirements-desktop-contract.txt
          python3 -m pip check

      - name: Verify immutable release identity
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          cargo_version="$(python3 - <<'PY'
          import pathlib
          import tomllib
          print(tomllib.loads(pathlib.Path("desktop/src-tauri/Cargo.toml").read_text())["package"]["version"])
          PY
          )"
          test "$version" = "$cargo_version"
          test "$REQUESTED_TAG" = "desktop-v$version"
          release_sha="$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$release_sha"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Require the public EnMotion repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          test "$repository" = "paulyan678/enmotion"
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" = "false"

      - name: Require a main commit with successful CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          successful_runs="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$RELEASE_SHA" \
              -f status=completed \
              -f per_page=100 \
              --jq '[.workflow_runs[]
                | select(.event == "push" and .conclusion == "success")]
                | length'
          )"
          test "$successful_runs" -ge 1

      - name: Validate desktop contracts
        run: |
          python3 -m unittest discover -s desktop/python -p 'test_*.py'
          python3 -m compileall -q desktop/python desktop/scripts
          python3 desktop/scripts/validate.py
          test -f desktop/src-tauri/Cargo.lock

      - name: Build and test the static frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:all
          npm run check:colors
          npm run build
          npm run check:export

      - name: Upload immutable frontend export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enmotion-static-export
          path: frontend/out
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            asset_arch: arm64
            ffmpeg_path: /opt/homebrew/bin/ffmpeg
          - label: macOS Intel x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_arch: x64
            ffmpeg_path: /usr/local/bin/ffmpeg

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-desktop.txt

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: enmotion-static-export
          path: frontend/out

      - name: Require updater and Apple signing material
        shell: bash
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.ENMOTION_UPDATER_PUBLIC_KEY }}
          UPDATE_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CONTROL_PLANE_URL: ${{ vars.ENMOTION_CONTROL_PLANE_URL }}
          APPLE_P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for value in \
            "$UPDATE_PUBLIC_KEY" "$UPDATE_PRIVATE_KEY" "$CONTROL_PLANE_URL" \
            "$APPLE_P12" "$APPLE_P12_PASSWORD" "$APPLE_IDENTITY" \
            "$APPLE_ISSUER" "$APPLE_KEY_ID" "$APPLE_PRIVATE_KEY"; do
            test -n "$value"
          done
          case "$CONTROL_PLANE_URL" in https://*) ;; *) exit 1 ;; esac

      - name: Install native packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python3 -m pip install \
            -r requirements-desktop.txt \
            "pyinstaller==$PYINSTALLER_VERSION"
          python3 -m pip check
          python3 - <<'PY'
          import platform
          import torch

          expected = "2.2.2" if platform.machine() == "x86_64" else "2.13.0"
          actual = torch.__version__.partition("+")[0]
          if actual != expected:
              raise SystemExit(f"expected torch {expected}, installed {actual}")
          PY

      - name: Import Apple signing and notarization credentials
        shell: bash
        env:
          APPLE_P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEYCHAIN_PASSWORD"
          certificate="$RUNNER_TEMP/enmotion-developer-id.p12"
          key_file="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          keychain="$RUNNER_TEMP/enmotion-signing.keychain-db"
          printf '%s' "$APPLE_P12" | /usr/bin/base64 -D > "$certificate"
          printf '%s' "$APPLE_PRIVATE_KEY" > "$key_file"
          chmod 0600 "$certificate" "$key_file"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "APPLE_API_KEY_PATH=$key_file" >> "$GITHUB_ENV"
          echo "ENMOTION_BUILD_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign, and test the native sidecar
        shell: bash
        env:
          ENMOTION_FFMPEG_BINARY: ${{ matrix.ffmpeg_path }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ENMOTION_REQUIRE_CODE_SIGNING: "1"
        run: |
          set -euo pipefail
          python3 desktop/scripts/stage_frontend.py
          python3 desktop/scripts/build_sidecar.py --target "${{ matrix.target }}"
          core="desktop/src-tauri/binaries/enmotion-sidecar-runtime/enmotion-sidecar"
          worker="desktop/src-tauri/binaries/enmotion-demucs-worker-${{ matrix.target }}"
          sign_binary() {
            binary="$1"
            identifier="$2"
            codesign --force --timestamp --options runtime \
              --identifier "$identifier" \
              --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
              "$binary"
            codesign --verify --strict --verbose=2 \
              "$binary"
          }
          sign_binary "$core" "com.enmotion.desktop.sidecar"
          sign_binary "$worker" "com.enmotion.desktop.demucs-worker"
          smoke_dir="$RUNNER_TEMP/enmotion-sidecar-smoke"
          mkdir -p "$smoke_dir"
          (
            cd "$smoke_dir"
            ENMOTION_DEMUCS_WORKER="$GITHUB_WORKSPACE/$worker" \
              "$GITHUB_WORKSPACE/$core" \
              --verify-bundle
          )
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml \
            --target "${{ matrix.target }}"

      - name: Render release-only updater configuration
        shell: bash
        env:
          ENMOTION_UPDATER_PUBLIC_KEY: ${{ vars.ENMOTION_UPDATER_PUBLIC_KEY }}
          ENMOTION_CONTROL_PLANE_URL: ${{ vars.ENMOTION_CONTROL_PLANE_URL }}
        run: |
          python3 desktop/scripts/render_release_config.py \
            --output desktop/src-tauri/tauri.release.conf.json
          python3 desktop/scripts/validate.py --release --staged \
            --target "${{ matrix.target }}"

      - name: Build signed and notarized Tauri bundles
        shell: bash
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          ENMOTION_CONTROL_PLANE_URL: ${{ vars.ENMOTION_CONTROL_PLANE_URL }}
        run: |
          set -euo pipefail
          npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build \
            --ci \
            --target "${{ matrix.target }}" \
            --config src-tauri/tauri.release.conf.json

      - name: Verify notarization, Gatekeeper, and bundle signatures
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$(find "$bundle_root" -type d -name 'EnMotion.app' -print -quit)"
          dmg_path="$(find "$bundle_root" -type f -name '*.dmg' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          core_sidecar="$app_path/Contents/Resources/sidecar/enmotion-sidecar"
          core_identifier="$(
            codesign -d --verbose=4 "$core_sidecar" 2>&1 \
              | awk -F= '/^Identifier=/{print $2; exit}'
          )"
          test "$core_identifier" = "com.enmotion.desktop.sidecar"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_path"

      - name: Normalize release assets and generate SBOM
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          bundle_root="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-assets
          dmg_path="$(find "$bundle_root" -type f -name '*.dmg' -print -quit)"
          updater_path="$(find "$bundle_root" -type f -name '*.app.tar.gz' -print -quit)"
          test -f "$updater_path.sig"
          cp "$dmg_path" "release-assets/EnMotion-${VERSION}-macOS-${{ matrix.asset_arch }}.dmg"
          updater_name="EnMotion-${VERSION}-macOS-${{ matrix.asset_arch }}.app.tar.gz"
          cp "$updater_path" "release-assets/$updater_name"
          cp "$updater_path.sig" "release-assets/$updater_name.sig"
          python3 desktop/scripts/generate_sbom.py \
            --target "${{ matrix.target }}" \
            --version "$VERSION" \
            --ffmpeg "${{ matrix.ffmpeg_path }}" \
            --output "release-assets/EnMotion-${VERSION}-${{ matrix.target }}.cdx.json"

      - name: Upload verified macOS assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.target }}
          path: release-assets
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Apple credentials
        if: always()
        shell: bash
        run: |
          if [ -n "${ENMOTION_BUILD_KEYCHAIN:-}" ]; then
            security delete-keychain "$ENMOTION_BUILD_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/enmotion-developer-id.p12 "$RUNNER_TEMP"/AuthKey_*.p8

  build-windows:
    name: Build Windows x64
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-desktop.txt

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: enmotion-static-export
          path: frontend/out

      - name: Require updater and Windows signing material
        shell: pwsh
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.ENMOTION_UPDATER_PUBLIC_KEY }}
          UPDATE_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CONTROL_PLANE_URL: ${{ vars.ENMOTION_CONTROL_PLANE_URL }}
          WINDOWS_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          foreach ($value in @(
            $env:UPDATE_PUBLIC_KEY, $env:UPDATE_PRIVATE_KEY, $env:CONTROL_PLANE_URL,
            $env:WINDOWS_PFX, $env:WINDOWS_PFX_PASSWORD, $env:WINDOWS_TIMESTAMP
          )) {
            if ([string]::IsNullOrWhiteSpace($value)) { throw "Release signing configuration is incomplete" }
          }
          if (-not $env:CONTROL_PLANE_URL.StartsWith("https://")) { throw "Control plane must use HTTPS" }
          $trustedTimestamp = (
            $env:WINDOWS_TIMESTAMP.StartsWith("https://") -or
            $env:WINDOWS_TIMESTAMP -eq "http://timestamp.digicert.com"
          )
          if (-not $trustedTimestamp) {
            throw "Timestamp endpoint must use HTTPS or the official DigiCert RFC 3161 endpoint"
          }

      - name: Install native packaging dependencies
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust target installation failed" }
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          $chocolateyRoot = if ($env:ChocolateyInstall) {
            $env:ChocolateyInstall
          } else {
            "C:\ProgramData\chocolatey"
          }
          $ffmpegRoot = Join-Path $chocolateyRoot "lib"
          $ffmpeg = Get-ChildItem $ffmpegRoot -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.FullName -match '[\\/]tools[\\/]' } |
            Select-Object -First 1
          if (-not $ffmpeg) { throw "Chocolatey FFmpeg payload was not found" }
          & $ffmpeg.FullName -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Resolved FFmpeg payload is not executable" }
          "ENMOTION_FFMPEG_BINARY=$($ffmpeg.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          python -m pip install -r requirements-desktop.txt "pyinstaller==$env:PYINSTALLER_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Python dependency check failed" }

      - name: Import Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "enmotion-authenticode.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_PFX))
          icacls $certificate /inheritance:r /grant:r "${env:USERNAME}:(R)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not protect the Authenticode certificate" }
          "ENMOTION_WINDOWS_CERTIFICATE_PATH=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build, sign, and test the native sidecar
        shell: pwsh
        env:
          ENMOTION_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          ENMOTION_WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          python desktop/scripts/stage_frontend.py
          if ($LASTEXITCODE -ne 0) { throw "Frontend staging failed" }
          python desktop/scripts/build_sidecar.py --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Sidecar build failed" }
          $sidecar = (Resolve-Path "desktop/src-tauri/binaries/enmotion-sidecar-runtime/enmotion-sidecar.exe").Path
          $worker = (Resolve-Path "desktop/src-tauri/binaries/enmotion-demucs-worker-x86_64-pc-windows-msvc.exe").Path
          & desktop/scripts/sign-windows.ps1 $sidecar
          & desktop/scripts/sign-windows.ps1 $worker
          $env:ENMOTION_DEMUCS_WORKER = $worker
          $smokeDirectory = Join-Path $env:RUNNER_TEMP "enmotion-sidecar-smoke"
          New-Item -ItemType Directory -Force $smokeDirectory | Out-Null
          Push-Location $smokeDirectory
          try {
            & $sidecar --verify-bundle
            if ($LASTEXITCODE -ne 0) { throw "Signed sidecar bundle test failed" }
          } finally {
            Pop-Location
          }
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust tests failed" }

      - name: Render release-only updater configuration
        shell: pwsh
        env:
          ENMOTION_UPDATER_PUBLIC_KEY: ${{ vars.ENMOTION_UPDATER_PUBLIC_KEY }}
          ENMOTION_CONTROL_PLANE_URL: ${{ vars.ENMOTION_CONTROL_PLANE_URL }}
        run: |
          python desktop/scripts/render_release_config.py --output desktop/src-tauri/tauri.release.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Updater configuration render failed" }
          python desktop/scripts/validate.py --release --staged --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Desktop release validation failed" }

      - name: Build signed Tauri bundles
        shell: pwsh
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ENMOTION_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          ENMOTION_WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          ENMOTION_CONTROL_PLANE_URL: ${{ vars.ENMOTION_CONTROL_PLANE_URL }}
        run: |
          npx --yes "@tauri-apps/cli@$env:TAURI_CLI_VERSION" build --ci `
            --target x86_64-pc-windows-msvc `
            --config src-tauri/tauri.release.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed" }

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $bundleRoot = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $application = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/enmotion.exe"
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
            throw "Signed EnMotion application executable was not found"
          }
          $targets = @(
            "desktop/src-tauri/binaries/enmotion-sidecar-runtime/enmotion-sidecar.exe",
            "desktop/src-tauri/binaries/enmotion-demucs-worker-x86_64-pc-windows-msvc.exe",
            $application
          ) + @(Get-ChildItem $bundleRoot -Recurse -File -Include *.exe | ForEach-Object FullName)
          if ($targets.Count -lt 4) { throw "Expected signed sidecars, application, and installer were not found" }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target
            if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $target" }
          }

      - name: Normalize release assets and generate SBOM
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $bundleRoot = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem $bundleRoot -Recurse -File -Filter *-setup.exe | Select-Object -First 1
          if (-not $installer -or -not (Test-Path ($installer.FullName + ".sig"))) {
            throw "Signed Windows installer updater artifacts are incomplete"
          }
          $installerName = "EnMotion-Setup-$env:VERSION-Windows-x64.exe"
          Copy-Item $installer.FullName "release-assets/$installerName"
          Copy-Item ($installer.FullName + ".sig") "release-assets/$installerName.sig"
          python desktop/scripts/generate_sbom.py `
            --target x86_64-pc-windows-msvc `
            --version $env:VERSION `
            --ffmpeg $env:ENMOTION_FFMPEG_BINARY `
            --output "release-assets/EnMotion-$env:VERSION-x86_64-pc-windows-msvc.cdx.json"
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed" }

      - name: Upload verified Windows assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-x86_64-pc-windows-msvc
          path: release-assets
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Windows certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item "$env:RUNNER_TEMP/enmotion-authenticode.pfx" -Force -ErrorAction SilentlyContinue

  publish:
    name: Verify and publish public release
    needs:
      - preflight
      - build-macos
      - build-windows
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Revalidate immutable release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"

      - name: Create draft and upload native assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          expected = {
              f"EnMotion-{version}-macOS-arm64.dmg",
              f"EnMotion-{version}-macOS-arm64.app.tar.gz",
              f"EnMotion-{version}-macOS-arm64.app.tar.gz.sig",
              f"EnMotion-{version}-aarch64-apple-darwin.cdx.json",
              f"EnMotion-{version}-macOS-x64.dmg",
              f"EnMotion-{version}-macOS-x64.app.tar.gz",
              f"EnMotion-{version}-macOS-x64.app.tar.gz.sig",
              f"EnMotion-{version}-x86_64-apple-darwin.cdx.json",
              f"EnMotion-Setup-{version}-Windows-x64.exe",
              f"EnMotion-Setup-{version}-Windows-x64.exe.sig",
              f"EnMotion-{version}-x86_64-pc-windows-msvc.cdx.json",
          }
          root = Path("release-assets")
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              missing = sorted(expected - actual)
              unexpected = sorted(actual - expected)
              raise SystemExit(
                  f"release asset inventory mismatch; missing={missing}, unexpected={unexpected}"
              )
          limit = 2 * 1024 * 1024 * 1024
          oversized = [str(root / name) for name in sorted(expected) if (root / name).stat().st_size >= limit]
          if oversized:
              raise SystemExit("release assets exceed the 2 GiB limit: " + ", ".join(oversized))
          PY
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to mutate an existing release." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "EnMotion 桌面版 ${VERSION}" \
            --notes-file CHANGELOG.md
          gh release upload "$RELEASE_TAG" release-assets/*

      - name: Build updater metadata and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          release_id="$(
            gh release view "$RELEASE_TAG" \
              --json databaseId,isDraft \
              --jq 'select(.isDraft).databaseId'
          )"
          test -n "$release_id"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          asset_id() {
            local asset_name="$1"
            local asset_path="$2"
            local expected_size
            expected_size="$(wc -c < "$asset_path" | tr -d '[:space:]')"
            jq -er --arg name "$asset_name" --argjson size "$expected_size" \
              '.assets
               | map(select(
                   .name == $name
                   and .state == "uploaded"
                   and .size == $size
                 ))
               | if length == 1
                 then .[0].id
                 else error("expected exactly one release asset named " + $name)
                 end' <<<"$release_json"
          }
          mac_arm_name="EnMotion-${VERSION}-macOS-arm64.app.tar.gz"
          mac_x64_name="EnMotion-${VERSION}-macOS-x64.app.tar.gz"
          windows_x64_name="EnMotion-Setup-${VERSION}-Windows-x64.exe"
          mac_arm_path="release-assets/${mac_arm_name}"
          mac_x64_path="release-assets/${mac_x64_name}"
          windows_x64_path="release-assets/${windows_x64_name}"
          asset_id "$mac_arm_name" "$mac_arm_path" >/dev/null
          asset_id "$mac_x64_name" "$mac_x64_path" >/dev/null
          asset_id "$windows_x64_name" "$windows_x64_path" >/dev/null
          mac_arm_source="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${mac_arm_name}"
          mac_x64_source="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${mac_x64_name}"
          windows_x64_source="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${windows_x64_name}"
          python3 desktop/scripts/generate_update_manifest.py \
            --version "$VERSION" \
            --asset "macos-arm64=${mac_arm_path}" \
            --asset "macos-x86_64=${mac_x64_path}" \
            --asset "windows-x86_64=${windows_x64_path}" \
            --source "macos-arm64=${mac_arm_source}" \
            --source "macos-x86_64=${mac_x64_source}" \
            --source "windows-x86_64=${windows_x64_source}" \
            --notes "EnMotion 桌面版 ${VERSION}" \
            --output release-assets/control-plane-releases.json
          python3 - <<'PY'
          from pathlib import Path
          limit = 2 * 1024 * 1024 * 1024
          assets = sorted(path for path in Path("release-assets").iterdir() if path.is_file())
          if not assets:
              raise SystemExit("no release assets were downloaded")
          oversized = [str(path) for path in assets if path.stat().st_size >= limit]
          if oversized:
              raise SystemExit("release assets exceed the 2 GiB limit: " + ", ".join(oversized))
          PY
          (
            cd release-assets
            shasum -a 256 * > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

      - name: Attest final release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-assets/*

      - name: Complete and publish the verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(
            gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft
          )" = "true"
          gh release upload "$RELEASE_TAG" \
            release-assets/control-plane-releases.json \
            release-assets/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
