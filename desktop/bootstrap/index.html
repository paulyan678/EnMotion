<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>EnMotion</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #101014;
        color: #f5f5f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 35%, rgb(52 216 196 / 12%), transparent 38%),
          #101014;
      }

      main {
        width: min(440px, calc(100vw - 48px));
        text-align: center;
      }

      .mark {
        width: 58px;
        height: 58px;
        margin: 0 auto 18px;
        filter: drop-shadow(0 18px 34px rgb(52 216 196 / 20%));
      }

      .mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 630;
        letter-spacing: -0.02em;
      }

      p {
        min-height: 22px;
        margin: 10px 0 0;
        color: rgb(245 245 247 / 62%);
        font-size: 13px;
        line-height: 1.55;
      }

      [role="progressbar"] {
        width: 160px;
        height: 2px;
        margin: 24px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / 9%);
      }

      [role="progressbar"]::after {
        display: block;
        width: 42%;
        height: 100%;
        content: "";
        border-radius: inherit;
        background: #34d8c4;
        animation: loading 1.1s ease-in-out infinite;
      }

      body[data-error="true"] [role="progressbar"] {
        display: none;
      }

      body[data-error="true"] p {
        color: #ff9f9f;
      }

      @keyframes loading {
        from {
          transform: translateX(-115%);
        }
        to {
          transform: translateX(350%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        [role="progressbar"]::after {
          animation-duration: 2.8s;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 1024 1024">
          <path
            fill="#f2ede4"
            fill-rule="evenodd"
            d="M216 160h608l-48 160H472v96h272l-48 160H472v128h352l-48 160H216V160Zm120 190v324l256-162-256-162Z"
          />
          <path
            fill="#34d8c4"
            d="M584 160h240l-48 160H536l48-160Zm0 544h240l-48 160H536l48-160Z"
          />
          <path fill="#ffa94d" d="M672 472h60l-24 80h-60l24-80Z" />
        </svg>
      </div>
      <h1>EnMotion</h1>
      <p id="status">正在启动安全的本地工作区…</p>
      <div
        role="progressbar"
        aria-label="正在启动 EnMotion"
        aria-valuemin="0"
        aria-valuemax="100"
      ></div>
    </main>
    <script src="bootstrap.js"></script>
  </body>
</html>
