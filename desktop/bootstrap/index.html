<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>EnMotion</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #101014;
        color: #f5f5f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 35%, rgb(120 92 255 / 14%), transparent 38%),
          #101014;
      }

      main {
        width: min(440px, calc(100vw - 48px));
        text-align: center;
      }

      .mark {
        width: 42px;
        height: 42px;
        margin: 0 auto 18px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 13px;
        background: linear-gradient(145deg, #8f79ff, #5f46dd);
        box-shadow: 0 18px 44px rgb(67 44 185 / 30%);
      }

      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 630;
        letter-spacing: -0.02em;
      }

      p {
        min-height: 22px;
        margin: 10px 0 0;
        color: rgb(245 245 247 / 62%);
        font-size: 13px;
        line-height: 1.55;
      }

      [role="progressbar"] {
        width: 160px;
        height: 2px;
        margin: 24px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / 9%);
      }

      [role="progressbar"]::after {
        display: block;
        width: 42%;
        height: 100%;
        content: "";
        border-radius: inherit;
        background: #a998ff;
        animation: loading 1.1s ease-in-out infinite;
      }

      body[data-error="true"] [role="progressbar"] {
        display: none;
      }

      body[data-error="true"] p {
        color: #ff9f9f;
      }

      @keyframes loading {
        from {
          transform: translateX(-115%);
        }
        to {
          transform: translateX(350%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        [role="progressbar"]::after {
          animation-duration: 2.8s;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>EnMotion</h1>
      <p id="status">正在启动安全的本地工作区…</p>
      <div
        role="progressbar"
        aria-label="正在启动 EnMotion"
        aria-valuemin="0"
        aria-valuemax="100"
      ></div>
    </main>
    <script src="bootstrap.js"></script>
  </body>
</html>
