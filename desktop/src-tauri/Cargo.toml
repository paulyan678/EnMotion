[package]
name = "enmotion-desktop"
version = "1.0.10"
description = "EnMotion private desktop shell"
authors = ["EnMotion"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "enmotion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
hmac = "0.12.1"
rand = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "1.44.2", features = ["sync", "time"] }
url = "2.5.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
